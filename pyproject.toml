[project]
name = "riyaz"
version = "0.1.0"
description = "Riyaz: a daily piano-practice coach for a MIDI keyboard"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "pywebview>=6.1",
    "mido>=1.3.3",
    "python-rtmidi>=1.5.8,<1.6",
]

[dependency-groups]
audio = [
    "basic-pitch==0.4.0",
    "librosa>=0.10,<1.0",
    "setuptools<81",
]
dev = [
    "httpx>=0.27,<0.29",
    "pytest>=8",
    "pyinstaller>=6.19",  # build only (make build-mac); not needed to run the app
    "music21>=10.5.2",
]

[tool.uv]
# Keep everything inside the project folder. See README "Project-local environment".
cache-dir = "./.cache/uv"
# UV_PYTHON_INSTALL_DIR has no pyproject setting; Makefile and env.sh export it.
python-preference = "managed"   # Makefile/env.sh use only-managed; "managed" lets plain `uv run` reuse .venv
python-downloads = "manual"   # never download Python to a global folder by accident
package = false
# `uv sync` installs the dev group and the audio group (audio import, about 116 MB download).
# Base app only: `uv sync --no-group audio` (then `make build-mac` builds the base app).
default-groups = ["dev", "audio"]
# basic-pitch 0.4.0 asks for tensorflow(-macos) < 2.15.1, which has no Python 3.12 wheel on macOS.
# The app uses the model files in the basic-pitch wheel with CoreML instead (RESEARCH.md change 9).
override-dependencies = [
    "tensorflow-macos; sys_platform == 'never'",
    "tensorflow; sys_platform == 'never'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
